# CSV with 'query' and 'answer' columns: the output of `refilter` (or of
# `create_embeddings` directly when its gate is current).
input_csv: ./qa_embeddings_output/iieg_diverso_2023_2025/refiltered/embeddings_qa.csv

# Where the enriched CSV (with 'hard_negative_mined') will be written.
output_path: ./qa_embeddings_output/iieg_diverso_2023_2025/mined

# Baseline multilingual embedding model used to mine negatives.
model_name: sentence-transformers/paraphrase-multilingual-mpnet-base-v2

# Hard negatives to mine per query.
num_negatives: 1
